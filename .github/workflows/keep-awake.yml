name: keep-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake PlugNest
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://plugnest.onrender.com/ || true)
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then break; fi
            sleep 20
          done
